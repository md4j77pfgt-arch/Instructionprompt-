<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HACK 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.screen {
  width: 100%;
  max-width: 480px;
  text-align: center;
}

button {
  border: none;
  padding: 15px 28px;
  font-weight: bold;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

#clickButton {
  background: #e60000;
  color: white;
  margin-top: 20px;
}

#update {
  color: #ff3333;
  font-size: 13px;
  font-weight: bold;
  margin-top: 12px;
  letter-spacing: 2px;
}

#binary {
  color: #00ff55;
  font-family: monospace;
  overflow-wrap: anywhere;
  line-height: 1.8;
  font-size: 17px;
  min-height: 120px;
}

.panel {
  background: #170000;
  border: 1px solid red;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 0 25px #650000;
  text-align: left;
  animation: spawn .6s ease;
}

.panel h1 {
  color: red;
  text-align: center;
  letter-spacing: 4px;
}

.panel p {
  color: #ffaaaa;
  text-align: center;
}

textarea {
  width: 100%;
  height: 330px;
  background: #080808;
  border: 1px solid #770000;
  color: #ffcccc;
  padding: 12px;
  resize: vertical;
  font-family: monospace;
  border-radius: 7px;
  font-size: 13px;
}

#copy {
  background: red;
  color: white;
  width: 100%;
  margin-top: 15px;
}

.hidden {
  display: none !important;
}

@keyframes spawn {
  from {
    opacity: 0;
    transform: scale(.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<div class="screen">

  <div id="welcome">
    <h2>Click here to have prompt</h2>
    <button id="clickButton">CLICK</button>
    <p id="update">UPDATE 3.1</p>
  </div>

  <div id="animation" class="hidden">
    <div id="binary"></div>
  </div>

  <div id="hack" class="panel hidden">
    <h1>HACK 2.0</h1>
    <p>Your prompt is ready.</p>

    <textarea id="instructions" readonly></textarea>

    <button id="copy">COPY</button>
    <p id="copyStatus"></p>
  </div>

</div>

<script>

document.getElementById("clickButton").addEventListener("click", function() {

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("animation").classList.remove("hidden");

  let count = 0;
  const binary = document.getElementById("binary");

  const animation = setInterval(function() {
    binary.textContent += Math.random() > 0.5 ? "1" : "0";
    count++;

    if (count >= 130) {
      clearInterval(animation);

      setTimeout(function() {
        document.getElementById("animation").classList.add("hidden");
        document.getElementById("hack").classList.remove("hidden");
        document.getElementById("instructions").value = promptText;
      }, 500);
    }
  }, 20);

});

document.getElementById("copy").addEventListener("click", async function() {

  const area = document.getElementById("instructions");

  try {
    await navigator.clipboard.writeText(area.value);
    document.getElementById("copyStatus").textContent = "COPIED SUCCESSFULLY!";
  } catch (error) {
    area.select();
    document.execCommand("copy");
    document.getElementById("copyStatus").textContent = "COPY ATTEMPTED!";
  }

});
</script>

</body>
</html>
